<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to cart drawer — preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #172117;
      font-family: Questrial, "Helvetica Neue", Arial, sans-serif;
    }
    .preview-flag {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 16px;
      background: #172117;
      color: #f4efe6;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .fp-section { background: #fff; padding: 40px 0 28px; }
    .cg-section { background: #fff; padding: 12px 0 48px; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .fp-heading, .cg-heading {
      margin: 0 0 28px;
      color: #172117;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .cg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .cg-head .cg-heading { margin: 0; letter-spacing: 0.4px; }
    .cg-view { color: #555; font-size: 15px; text-decoration: none; border-bottom: 1px solid #555; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .fp-card {
      background: #fff;
      border: 1px solid rgba(14, 77, 34, 0.14);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .fp-card:hover { transform: translateY(-4px); border-color: #0e4d22; box-shadow: 0 16px 34px rgba(14, 77, 34, 0.12); }
    .fp-image-wrap { position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden; background: #f4efe6; }
    .fp-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.45s ease; }
    .fp-card:hover img { transform: scale(1.06); }
    .fp-sale-badge {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: #e7622c; color: #fff; font-size: 12px; font-weight: 700;
      line-height: 1; padding: 6px 10px; border-radius: 999px;
    }
    .fp-info { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .fp-label { color: #0e4d22; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .fp-title { color: #172117; font-size: 15px; font-weight: 600; line-height: 1.35; text-decoration: none; min-height: 2.7em; }
    .fp-price-wrap { margin-top: auto; display: flex; align-items: baseline; gap: 8px; }
    .fp-price { color: #0e4d22; font-size: 16px; font-weight: 700; }
    .fp-compare { color: #6d756d; font-size: 14px; text-decoration: line-through; }
    .fp-atc {
      margin-top: 4px; width: 100%; min-height: 42px; border: 1px solid #0e4d22; border-radius: 8px;
      background: #0e4d22; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease;
    }
    .fp-atc:hover { background: #e7622c; border-color: #e7622c; }
    .drawer {
      position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end;
      background: rgba(23, 33, 23, 0.48); visibility: hidden; opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .drawer.open { visibility: visible; opacity: 1; }
    .panel {
      width: min(440px, calc(100vw - 12px)); height: 100%; background: #fff;
      border-radius: 22px 0 0 22px; box-shadow: -28px 0 70px rgba(14, 77, 34, 0.22);
      display: flex; flex-direction: column; transform: translateX(100%);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .drawer.open .panel { transform: translateX(0); }
    .head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 22px 20px 18px;
      background: radial-gradient(120px 80px at 0% 0%, rgba(231, 98, 44, 0.16), transparent 70%), linear-gradient(180deg, #f4efe6, #fff);
      border-bottom: 1px solid rgba(14, 77, 34, 0.12);
    }
    .kicker { margin: 0 0 2px; color: #e7622c; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .head h2 { margin: 0; color: #0e4d22; font-size: 26px; letter-spacing: -0.03em; }
    .close {
      width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(14, 77, 34, 0.16);
      background: #fff; color: #0e4d22; font-size: 22px; line-height: 1; cursor: pointer;
    }
    .close:hover { background: #0e4d22; color: #fff; }
    .added {
      display: none; margin: 12px 16px 0; padding: 10px 12px; border-radius: 12px;
      background: #eef6f0; color: #0e4d22; font-size: 13px; font-weight: 700;
    }
    .added.show { display: block; }
    .items { flex: 1; overflow: auto; padding: 4px 16px 8px; }
    .empty { height: 100%; display: grid; place-items: center; text-align: center; color: #0e4d22; padding: 24px; }
    .empty h3 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.03em; }
    .empty p { margin: 0; color: #6d756d; }
    .line { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(14, 77, 34, 0.1); }
    .line img { width: 84px; height: 84px; object-fit: cover; border-radius: 14px; background: #f4efe6; }
    .line h3 { margin: 0; font-size: 15px; }
    .line .meta { margin: 4px 0 8px; color: #0e4d22; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { color: #0e4d22; font-weight: 700; }
    .qty { display: inline-flex; align-items: center; border: 1px solid rgba(14, 77, 34, 0.18); border-radius: 999px; overflow: hidden; }
    .qty button { width: 28px; height: 28px; border: 0; background: #f4efe6; color: #0e4d22; font: inherit; font-weight: 700; cursor: pointer; }
    .qty span { min-width: 22px; text-align: center; font-size: 14px; }
    .remove { border: 0; background: none; color: #6d756d; font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
    .foot { padding: 16px 20px 22px; background: #f7f4ee; border-top: 1px solid rgba(14, 77, 34, 0.12); }
    .sub { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .note { margin: 0 0 12px; color: #0e4d22; font-size: 13px; font-weight: 600; }
    .checkout {
      width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: #0e4d22; color: #fff;
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .checkout:hover { background: #e7622c; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="preview-flag">Preview only — not published. Add to cart opens the drawer from the right for every visitor.</div>

  <section class="fp-section">
    <div class="wrap">
      <h2 class="fp-heading">Featured products</h2>
      <div class="grid" id="featured"></div>
    </div>
  </section>

  <section class="cg-section">
    <div class="wrap">
      <div class="cg-head">
        <h2 class="cg-heading">CURTAINS</h2>
        <a class="cg-view" href="https://dtex.com.bd/collections/waffle-curtain">View all curtains</a>
      </div>
      <div class="grid" id="curtains"></div>
    </div>
  </section>

  <div class="drawer" id="drawer" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-label="Your cart">
      <div class="head">
        <div>
          <p class="kicker">Dtex</p>
          <h2>Your cart</h2>
        </div>
        <button class="close" type="button" id="close" aria-label="Close cart">×</button>
      </div>
      <div class="added" id="added"></div>
      <div class="items" id="items"></div>
      <div class="foot" id="foot">
        <div class="sub"><span>Estimated total</span><span id="total">Tk 0</span></div>
        <p class="note">Home delivery in 2–3 days · 3 day easy return</p>
        <button class="checkout" type="button">Check out</button>
      </div>
    </div>
  </div>

  <script>
    const products = [
      ["featured", "export", "Bedsheet", "Export Quality Bedsheet", 650, 800, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-03at21.27.13.jpg?v=1793774832"],
      ["featured", "parkel", "Bedsheet", "Parkel Bedsheet", 850, 1050, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-03at03.10.42.jpg?v=1793765170"],
      ["featured", "twill", "Bedsheet", "Twill Bedsheet", 950, 1250, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-03at03.05.17.jpg?v=1793725615"],
      ["featured", "3d", "3D Bedsheet", "3D Digital Bedsheet", 1450, 2250, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-09-18at06.06.56_1.jpg?v=1789741343"],
      ["featured", "curtain", "Curtain", "Combo Waffle Curtain", 1100, 1380, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-03at22.24.27_062fbe13-5f8f-4624-aaaa-56ea6dc11127.jpg?v=1793798498"],
      ["featured", "regular", "Comforter", "Regular Comforter", 1050, 1450, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-10-29at01.50.50_1.jpg?v=1793630983"],
      ["featured", "twillc", "Comforter", "Twill Comforter", 1950, 2500, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-10-29at01.50.49.jpg?v=1793628557"],
      ["featured", "3dc", "3D Comforter", "3D Digital Comforter", 2800, 3500, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-10-29at01.50.54.jpg?v=1793629617"],
      ["curtains", "curtain", "Curtain", "Combo Waffle Curtain", 1100, 1380, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-03at22.24.27_062fbe13-5f8f-4624-aaaa-56ea6dc11127.jpg?v=1793798498"],
      ["curtains", "waffle", "Waffle", "Waffle Curtain", 980, 1200, "https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-11-02at01.28.37.jpg?v=1793700000"]
    ];

    const money = (n) => "Tk " + n.toLocaleString("en-BD");
    const byId = Object.fromEntries(products.map((p) => [p[1], { id: p[1], label: p[2], title: p[3], price: p[4], compare: p[5], image: p[6] }]));
    const cart = [];

    function card(p) {
      const save = Math.round((p[5] - p[4]) / p[5] * 100);
      const el = document.createElement("article");
      el.className = "fp-card";
      el.innerHTML = `
        <span class="fp-image-wrap">
          <span class="fp-sale-badge">-${save}%</span>
          <img alt="${p[3]}" src="${p[6]}">
        </span>
        <div class="fp-info">
          <span class="fp-label">${p[2]}</span>
          <span class="fp-title">${p[3]}</span>
          <span class="fp-price-wrap"><span class="fp-price">${money(p[4])}</span><span class="fp-compare">${money(p[5])}</span></span>
          <button class="fp-atc" type="button" data-id="${p[1]}">Add to cart</button>
        </div>`;
      return el;
    }

    products.forEach((p) => document.getElementById(p[0]).appendChild(card(p)));

    const drawer = document.getElementById("drawer");
    const items = document.getElementById("items");
    const foot = document.getElementById("foot");
    const added = document.getElementById("added");
    const total = document.getElementById("total");

    function openDrawer() {
      drawer.hidden = false;
      requestAnimationFrame(() => drawer.classList.add("open"));
    }
    function closeDrawer() {
      drawer.classList.remove("open");
      setTimeout(() => { if (!drawer.classList.contains("open")) drawer.hidden = true; }, 380);
    }

    function render(justAdded) {
      if (!cart.length) {
        items.innerHTML = `<div class="empty"><div><h3>Your cart is empty</h3><p>Add a bedsheet, curtain, or comforter.</p></div></div>`;
        foot.hidden = true;
      } else {
        foot.hidden = false;
        items.innerHTML = cart.map((line) => `
          <div class="line">
            <img alt="" src="${line.image}">
            <div>
              <h3>${line.title}</h3>
              <div class="meta">${line.label}</div>
              <div class="row">
                <div class="qty">
                  <button type="button" data-qty="${line.id}" data-step="-1" aria-label="Decrease">−</button>
                  <span>${line.qty}</span>
                  <button type="button" data-qty="${line.id}" data-step="1" aria-label="Increase">+</button>
                </div>
                <span class="price">${money(line.price * line.qty)}</span>
              </div>
              <button class="remove" type="button" data-remove="${line.id}">Remove</button>
            </div>
          </div>`).join("");
        total.textContent = money(cart.reduce((sum, line) => sum + line.price * line.qty, 0));
      }
      if (justAdded) {
        added.textContent = "Added · " + justAdded;
        added.classList.add("show");
      }
    }

    function add(id) {
      const product = byId[id];
      const line = cart.find((item) => item.id === id);
      if (line) line.qty += 1;
      else cart.push({ ...product, qty: 1 });
      render(product.title);
      openDrawer();
    }

    document.body.addEventListener("click", (event) => {
      const addBtn = event.target.closest("[data-id]");
      if (addBtn) add(addBtn.dataset.id);
      const qtyBtn = event.target.closest("[data-qty]");
      if (qtyBtn) {
        const line = cart.find((item) => item.id === qtyBtn.dataset.qty);
        line.qty += Number(qtyBtn.dataset.step);
        if (line.qty < 1) cart.splice(cart.indexOf(line), 1);
        render();
      }
      const removeBtn = event.target.closest("[data-remove]");
      if (removeBtn) {
        const index = cart.findIndex((item) => item.id === removeBtn.dataset.remove);
        cart.splice(index, 1);
        render();
      }
    });

    document.getElementById("close").addEventListener("click", closeDrawer);
    drawer.addEventListener("click", (event) => { if (event.target === drawer) closeDrawer(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeDrawer(); });
    render();
  </script>
</body>
</html>
