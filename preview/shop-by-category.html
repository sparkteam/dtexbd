<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop by Category — desktop preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #172117;
      font-family: Questrial, "Helvetica Neue", Arial, sans-serif;
    }
    .artboard {
      width: 100%;
      background: #fff;
    }
    .preview-flag {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 16px;
      background: #172117;
      color: #f4efe6;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .sbc-section {
      background: #ffffff;
      padding-top: 40px;
      padding-bottom: 56px;
    }
    .sbc-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .sbc-heading {
      text-align: center;
      color: #111111;
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0 0 36px;
    }
    .sbc-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      justify-items: center;
    }
    .sbc-item {
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .sbc-circle {
      width: min(140px, 100%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f7e2db;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto 15px;
    }
    .sbc-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .sbc-placeholder {
      color: #8a5a4a;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sbc-title {
      color: #333333;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="artboard" id="artboard">
    <div class="preview-flag">Desktop preview — Shop by Category, 1440px. Not published.</div>
    <section class="sbc-section" aria-label="Shop by category">
      <div class="sbc-container">
        <h2 class="sbc-heading">Shop by category</h2>
        <div class="sbc-grid">
          <a class="sbc-item" href="https://dtex.com.bd/collections/bedsheet">
            <div class="sbc-circle">
              <img alt="Bedsheet" src="https://cdn.shopify.com/s/files/1/0604/2143/9537/files/Folded_Botanical_Bedding_Set.png">
            </div>
            <p class="sbc-title">Bedsheet</p>
          </a>
          <a class="sbc-item" href="https://dtex.com.bd/collections/premium-comforter">
            <div class="sbc-circle">
              <img alt="Comforter" src="https://cdn.shopify.com/s/files/1/0604/2143/9537/files/Comforters.png">
            </div>
            <p class="sbc-title">Comforter</p>
          </a>
          <a class="sbc-item" href="https://dtex.com.bd/collections/waffle-curtain">
            <div class="sbc-circle">
              <img alt="Curtain" src="https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsApp_Image_2026-10-29_at_02.52.32_2.jpg">
            </div>
            <p class="sbc-title">Curtain</p>
          </a>
          <a class="sbc-item" href="https://dtex.com.bd/collections/towel">
            <div class="sbc-circle">
              <img alt="Towel" src="/assets/category-towel.jpg">
            </div>
            <p class="sbc-title">Towel</p>
          </a>
          <a class="sbc-item" href="https://dtex.com.bd/collections/3d-digital-bed-sheet">
            <div class="sbc-circle">
              <img alt="3D Digital Bedsheet" src="https://cdn.shopify.com/s/files/1/0604/2143/9537/files/WhatsAppImage2026-09-18at06.06.56.jpg">
            </div>
            <p class="sbc-title">3D Digital Bedsheet</p>
          </a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
